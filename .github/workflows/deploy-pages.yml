name: Deploy portfolio to GitHub Pages

# Publishes the static export (next.config.ts -> output: "export") to the
# user-site repo shivang2607.github.io, which serves it at the domain root
# (https://shivang2607.com once DNS is pointed at GitHub Pages).
#
# Source lives here; the deploy target is a separate repo so the published
# artifact stays clean and no basePath juggling is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so build-time data (live DevLens star count) stays fresh.
    - cron: "0 3 * * 1"

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Lifts the unauthenticated GitHub API rate limit so the DevLens
          # star stat in components/sections/proof.tsx resolves in CI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Publish to shivang2607.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519,ecdsa,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

          cd out
          touch .nojekyll   # keep _next/ from being skipped by Jekyll processing
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git remote add origin git@github.com:shivang2607/shivang2607.github.io.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            git push -f origin main